name: generate animation

on:
  schedule:
    - cron: "0 */12 * * *"
  workflow_dispatch:
  # push:
  #   branches:
  #     - main

concurrency:
  group: output-branch
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      actions: write

    steps:
      # 1) 生成 snake SVG（输出到 dist/snake/）
      - name: generate github-contribution-grid-snake.svg
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/snake/github-contribution-grid-snake.svg
            dist/snake/github-contribution-grid-snake-dark.svg?palette=github-dark
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # 2) 暂存生成物
      - name: Stash generated svgs
        run: |
          ls -la dist/snake
          mkdir -p /tmp/snake
          cp -f dist/snake/github-contribution-grid-snake.svg /tmp/snake/
          cp -f dist/snake/github-contribution-grid-snake-dark.svg /tmp/snake/

      # 3) Checkout output 分支（用于写入，不会再用 github-pages 覆盖整个分支）
      - name: Checkout output branch
        uses: actions/checkout@v4
        with:
          ref: output

      # 4) 只更新 output 分支里的 snake/ 目录，保留 metrics/ 等其他目录
      - name: Copy snake assets into output branch
        run: |
          mkdir -p snake
          cp -f /tmp/snake/github-contribution-grid-snake.svg snake/
          cp -f /tmp/snake/github-contribution-grid-snake-dark.svg snake/

      # 5) 提交并推送到 output 分支
      - name: Commit and push
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add snake/*.svg
          git diff --cached --quiet || git commit -m "chore: update snake"
          git push

      # 6) 成功后删除本次 workflow run（可选；调试期建议先注释）
      - name: Delete this workflow run if success
        if: success()
        run: |
          curl -X DELETE \
            -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            -H "Accept: application/vnd.github+json" \
            https://api.github.com/repos/${{ github.repository }}/actions/runs/${{ github.run_id }}
