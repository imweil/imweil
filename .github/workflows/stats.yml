name: generate github readme stats

on:
  schedule:
    - cron: "0 0 * * *"   # run once per day (UTC)
  workflow_dispatch:

  push:
    branches:
      - main
      
jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      # Generate default theme stats
      - name: generate github-readme-stats (default)
        uses: anuraghazra/github-readme-stats@master
        with:
          username: ${{ github.repository_owner }}
          theme: default
          show_icons: true
          hide_border: false
          count_private: true
          cache_seconds: 86400
          output: dist/github-stats-default.svg

      # Generate dark theme stats
      - name: generate github-readme-stats (dark)
        uses: anuraghazra/github-readme-stats@master
        with:
          username: ${{ github.repository_owner }}
          theme: dark
          show_icons: true
          hide_border: false
          count_private: true
          cache_seconds: 86400
          output: dist/github-stats-dark.svg

      # Push generated SVGs to output branch
      - name: push stats svgs to output branch
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
          destination_dir: stats
          keep_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
