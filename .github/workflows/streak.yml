name: generate github readme streak stats

on:
  schedule:
    - cron: "0 0 * * *"   # run once per day (UTC)
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: generate streak stats svgs (default + dark)
        run: |
          set -euo pipefail
          mkdir -p dist

          USERNAME="${{ github.repository_owner }}"

          # default theme
          curl -fsSL \
            "https://streak-stats.demolab.com?user=${USERNAME}&theme=default&hide_border=false" \
            -o dist/github-streak-default.svg

          # dark theme
          curl -fsSL \
            "https://streak-stats.demolab.com?user=${USERNAME}&theme=dark&hide_border=false" \
            -o dist/github-streak-dark.svg

      - name: push streak svgs to the output branch
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
          destination_dir: streak
          keep_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
